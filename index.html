const numberWords=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function cardinal(n){if(n<=20)return numberWords[n];if(n<100){const t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];return t[Math.floor(n/10)]+(n%10?'-'+numberWords[n%10]:'')}if(n>=1000&&n<=999999){const rem=n%1000;return cardinal(Math.floor(n/1000))+' thousand'+(rem?(rem<100?' and ':' ')+cardinal(rem):'')}if(n<1000)return numberWords[Math.floor(n/100)]+' hundred'+(n%100?' and '+cardinal(n%100):'');return ''}

</script><script>
// expanded.js
function renderExtraVerbTab(v,t){
if(t==='Regular verbs'){v.innerHTML=`<div class="section-head"><h2>Your regular verb desk.</h2><span class="small muted">${regularVerbs.length} useful verbs</span></div><p class="muted">Base → past simple → past participle. Open a verb for an example. British English spelling.</p><input class="search" id="regularsearch" aria-label="Search regular verbs" placeholder="Search: travel, studied, cucinare…"><p class="small muted" id="regularcount" role="status"></p><div class="regular-table" id="regularrows"></div><div class="note"><strong>Regular does not mean “always add ed unchanged”.</strong> Study → studied; stop → stopped; travel → travelled. For regular verbs, past simple and past participle have the same form. <a href="#verbs/guide/spelling"><u>Spelling & -ed pronunciation ↗</u></a></div>`;const u=()=>{const q=document.querySelector('#regularsearch').value.toLowerCase();const rows=regularVerbs.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));document.querySelector('#regularcount').textContent=rows.length+(rows.length===1?' matching verb':' matching verbs');document.querySelector('#regularrows').innerHTML=`<div class="regular-heading"><span>BASE FORM</span><span>PAST SIMPLE</span><span>PAST PARTICIPLE</span><span>ITALIAN</span></div>`+rows.map(r=>`<details class="regular-row"><summary><strong>${r.base}</strong><span>${r.past}</span><span>${r.participle}</span><span>${r.it} <b>+</b></span></summary><div class="regular-example">${escape(r.example)}</div></details>`).join('')+(rows.length?'':'<p>No matching verbs.</p>')};document.querySelector('#regularsearch').oninput=u;u()}
if(t==='Modals')v.innerHTML=`<div class="ref-intro"><span>A2 → B1 / CAN DO</span><p>Ability, permission, requests, obligation and advice. Choose the meaning, then build the form.</p></div><div class="ref-grid">${modalCards.map((r,i)=>refCard(['modal'+i,r[0],r[1],r[2],r[3],r[4],'Core modals + base verb: no -s, no to, no do in questions. Have to follows a different pattern.'])).join('')}</div><div class="section-head"><h2>One situation. Different meanings.</h2></div><div class="panel table-wrap"><table><thead><tr><th>MEANING</th><th>EXAMPLE</th></tr></thead><tbody><tr><td>Ability</td><td>I can drive.</td></tr><tr><td>Permission</td><td>Can I park here?</td></tr><tr><td>Polite request</td><td>Could you move your car, please?</td></tr><tr><td>Obligation</td><td>You have to pay for parking.</td></tr><tr><td>Prohibition</td><td>You mustn’t park here.</td></tr><tr><td>No necessity</td><td>You don’t have to pay on Sundays.</td></tr><tr><td>Advice</td><td>You should use the car park.</td></tr></tbody></table></div><a class="btn secondary" href="#verbs/practice">Practise verb structures ↗</a>`;
if(t==='Imperative')v.innerHTML=`<h2>Say what to do.</h2><div class="panel"><p>Use the base verb without a subject for instructions: <strong>Turn left.</strong> Use <strong>don’t + base verb</strong> for negatives, and <strong>let’s + base verb</strong> for suggestions including you and the listener. Please makes an instruction more polite; a could-request may be more suitable in some situations.</p>${tr('Usa il verbo base senza soggetto per le istruzioni. Per negare usa don’t + verbo base; let’s + verbo base propone un’azione che include chi parla e chi ascolta. Please rende più cortese un’istruzione; in alcune situazioni è preferibile una richiesta con could.')}<div class="example">Be careful. / Don’t be late. / Let’s not hurry.</div></div><h3>Verb phrases you can use</h3><p class="muted">A verb phrase can be longer than one word. Some expressions below are phrasal verbs; others are a verb with an object or a prepositional phrase.</p><div class="imperative-grid">${imperativePhrases.map(([en,it,group])=>`<article class="word"><span class="eyebrow">${group}</span><strong class="block">${en}</strong>${tr(it)}</article>`).join('')}</div><div class="note"><strong>With separable phrasal verbs:</strong> turn off the light / turn the light off → turn it off. Keep a pronoun in the middle. “Look at” stays together: look at it.${tr('Nei phrasal verbs separabili, il pronome va in mezzo: turn it off. Look at invece resta unito: look at it.')}</div><a class="btn secondary" href="#grammar/15">Imperative exercises ↗</a>`;
}
let adjectiveGroup='All';
function renderExtraAdjectiveTab(a,t){
if(t==='Adjective atlas'){a.innerHTML=`<h2>Words that describe your world.</h2><p class="muted">${adjectiveAtlas.length} adjectives · meanings and original examples · Open a card to study it.</p><input class="search" id="adjsearch" aria-label="Search adjectives" placeholder="Search: happy, gentile, tired…"><div class="category-strip">${['All',...adjectiveGroups.map(g=>g[0])].map(g=>`<button class="chip ${adjectiveGroup===g?'selected':''}" data-agroup="${g}">${g}</button>`).join('')}</div><p class="small muted" id="adjcount" role="status"></p><div class="compact-words" id="adjwords"></div><div class="note"><strong>A feeling or its cause?</strong> I’m bored because the film is boring. / We’re excited because the trip is exciting. <a href="#adjectives/guide/confusing"><u>See the guide ↗</u></a></div>`;const u=()=>{const q=document.querySelector('#adjsearch').value.toLowerCase();const rows=adjectiveAtlas.filter(w=>(adjectiveGroup==='All'||w.group===adjectiveGroup)&&[w.en,w.it,w.example].join(' ').toLowerCase().includes(q));document.querySelector('#adjcount').textContent=rows.length+(rows.length===1?' adjective':' adjectives');document.querySelector('#adjwords').innerHTML=rows.map(w=>`<details class="word-tile"><summary><span class="word-icon" aria-hidden="true">${w.icon}</span><span><strong>${w.en}</strong><small>${w.group}</small></span><span class="tile-plus">+</span></summary><div class="word-detail"><p class="translation">${w.it}</p><p>${w.example}</p></div></details>`).join('')||'<p>No matching adjectives.</p>'};document.querySelector('#adjsearch').oninput=u;document.querySelectorAll('[data-agroup]').forEach(b=>b.onclick=()=>{adjectiveGroup=b.dataset.agroup;document.querySelectorAll('[data-agroup]').forEach(x=>x.classList.toggle('selected',x===b));u()});u()}
if(t==='Pronouns & possessives')a.innerHTML=`<h2>My, mine or myself?</h2><div class="panel"><p>Words traditionally called “possessive adjectives” (<strong>my, your, his…</strong>) are also called possessive determiners: they come before a noun. A possessive pronoun (<strong>mine, yours…</strong>) replaces the noun phrase. A reflexive pronoun (<strong>myself…</strong>) refers back to the subject.</p>${tr('Quelli tradizionalmente chiamati aggettivi possessivi sono anche detti determinanti possessivi: precedono un nome. I pronomi possessivi sostituiscono il gruppo nominale. I riflessivi rimandano al soggetto.')}<div class="example">This is my bag. → This bag is mine.<br>I made it myself. → I made it without help.</div></div><div class="panel table-wrap"><table><thead><tr><th>SUBJECT</th><th>OBJECT</th><th>BEFORE A NOUN</th><th>POSSESSIVE PRONOUN</th><th>REFLEXIVE</th></tr></thead><tbody>${[['I','me','my','mine','myself'],['you (singular)','you','your','yours','yourself'],['he','him','his','his','himself'],['she','her','her','hers','herself'],['it','it','its','—','itself'],['we','us','our','ours','ourselves'],['you (plural)','you','your','yours','yourselves'],['they','them','their','theirs','themselves']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">Its has no usual standalone possessive-pronoun form. It’s means it is or it has.</p><div class="ref-grid">${[['Personal pronouns','I called her. / She called me.','#grammar/4'],['Possession','my daughter’s bike / This bike is hers.','#grammar/5'],['Reflexives','We enjoyed ourselves.','#grammar/6'],['Relative pronouns','a person who helps / a book that I like','#grammar/16']].map(([title,example,href])=>`<article class="panel"><h3>${title}</h3><p>${example}</p><a class="text-btn" href="${href}">Rule & exercises ↗</a></article>`).join('')}</div><div class="note">Looking for <strong>some, any, much, many, a few, a little</strong>? <a href="#grammar/quantifiers"><u>Open the quantity quick reference ↗</u></a></div>`;
}
function quantityReference(){app.innerHTML=`<a class="small muted" href="#grammar">← Grammar index</a><p class="eyebrow" style="margin-top:25px">A2 / QUANTITY QUICK REFERENCE</p><h1>How much?<br>How many?</h1><div class="panel"><p>Use <strong>many / (a) few</strong> with plural countable nouns; <strong>much / (a) little</strong> with uncountable nouns. <strong>Some, any and a lot of</strong> can be used with both groups.</p>${tr('Many e (a) few si usano con nomi numerabili plurali; much e (a) little con non numerabili. Some, any e a lot of possono accompagnare entrambi i gruppi.')}<div class="table-wrap"><table><thead><tr><th>WORD</th><th>USE</th><th>EXAMPLE</th></tr></thead><tbody>${[['much','uncountable; common in questions and negatives','How much water? / We don’t have much time.'],['many','plural countable','How many tickets do we need?'],['a lot of / lots of','both; common in positive statements','a lot of people / a lot of water'],['a few','a small number; some','We have a few apples.'],['few','not many; often fewer than needed','Few buses run at night.'],['a little','a small amount; some','We have a little time, so we can talk.'],['little','not much; often less than needed','We have little time, so hurry.'],['some','positive statements; offers and requests','We need some bread. / Would you like some tea?'],['any','often questions and negatives','Are there any eggs? / There isn’t any milk.']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="compare-pair"><div><strong>A few / a little</strong><p>We have a few friends here.<br>We have a little money left.</p>${tr('Abbiamo alcuni amici qui. / Ci resta un po’ di denaro: si sottolinea la quantità presente.')}</div><div><strong>Few / little</strong><p>We have few friends here.<br>We have little money left.</p>${tr('Abbiamo pochi amici qui. / Ci resta poco denaro: si sottolinea la scarsità.')}</div></div><div class="mistake">Money, information, advice and luggage are normally uncountable: much money, some advice, a piece of information.</div><div class="lesson-bottom"><a class="btn" href="#grammar/9">Quantity exercises →</a><a class="btn secondary" href="#grammar/8">Some / any exercises →</a><a class="btn secondary" href="#grammar/3">Countable or uncountable? →</a></div>`}
let countryRegion='All';
function renderExtraEveryday(e,view){
if(view==='world'){e.innerHTML=`<div class="ref-intro"><span>A2 / AROUND THE WORLD</span><p>Where are you from? What nationality are you? Which languages do you speak?</p></div><h2>Continents & regions.</h2><div class="world-regions">${worldRegions.map(([en,it,icon])=>`<article class="calendar-item"><span aria-hidden="true">${icon}</span><strong>${en}</strong>${tr(it)}</article>`).join('')}</div><div class="note">Geography books use different continent models. In the seven-continent model, Australia is a continent; Oceania is the wider region including Australia, New Zealand and Pacific islands. We group these countries under Oceania below. Antarctica has no country entries in this learning table.${tr('I libri di geografia usano modelli diversi. Nel modello a sette continenti, Australia è un continente; Oceania è la regione più ampia che comprende Australia, Nuova Zelanda e isole del Pacifico. Nella tabella raggruppiamo questi paesi sotto Oceania. Per l’Antartide non sono elencati paesi.')}</div><div class="section-head"><h2>Countries, nationalities & languages.</h2><span class="small muted">${countries.length} examples</span></div><input id="countrysearch" class="search" aria-label="Search countries and nationalities" placeholder="Search: Italia, British, Spanish…"><div class="category-strip">${['All',...new Set(countries.map(c=>c.region))].map(r=>`<button data-region="${r}" class="chip ${countryRegion===r?'selected':''}">${r}</button>`).join('')}</div><p id="countrycount" class="small muted" role="status"></p><div class="panel table-wrap"><table><thead><tr><th>COUNTRY</th><th>ITALIAN</th><th>NATIONALITY / DEMONYM</th><th>LANGUAGE EXAMPLES</th></tr></thead><tbody id="countryrows"></tbody></table></div><p class="small muted">Languages shown are examples, not a complete list or a list of official languages. A nationality word does not tell you which languages an individual speaks.</p><div class="everyday-columns"><article class="panel"><h3>Country → nationality → language</h3><div class="example">I’m from Italy. / I’m Italian.<br>I speak Italian and a little English.</div><div class="example">She’s from Brazil. / She’s Brazilian.<br>She speaks Portuguese.</div>${tr('Sono italiano / vengo dall’Italia. Parlo italiano e un po’ d’inglese. Lei viene dal Brasile, è brasiliana e parla portoghese.')}<p>Capital letters: Italy, Italian, English. Usually no the before a country name, but: <strong>the UK, the United States, the Netherlands</strong>.</p></article><article class="panel"><h3>Useful distinctions</h3><p>The United Kingdom includes England, Scotland, Wales and Northern Ireland. British is not the same as English.</p>${tr('Il Regno Unito comprende Inghilterra, Scozia, Galles e Irlanda del Nord. British non significa soltanto English.')}<p><strong>New Zealander</strong> is a noun: “He is a New Zealander.” For an adjective, use New Zealand: “a New Zealand writer”.</p></article></div><details class="source-note"><summary>Further reading</summary><p><a href="https://www.nationalgeographic.org/national-geographic-map-policy" target="_blank" rel="noopener">National Geographic: continent model</a> · <a href="https://www.gov.uk/government/publications/nationalities/list-of-nationalities" target="_blank" rel="noopener">Nationality word reference</a>. Original English-learning examples.</p></details>`;const u=()=>{const q=document.querySelector('#countrysearch').value.toLowerCase();const rows=countries.filter(c=>(countryRegion==='All'||c.region===countryRegion)&&Object.values(c).join(' ').toLowerCase().includes(q));document.querySelector('#countrycount').textContent=rows.length+(rows.length===1?' country':' countries');document.querySelector('#countryrows').innerHTML=rows.map(c=>`<tr><td><span aria-hidden="true">${c.flag}</span> ${c.country}</td><td>${c.it}</td><td>${c.nationality}</td><td>${c.languages}</td></tr>`).join('')||'<tr><td colspan="4">No matching countries.</td></tr>'};document.querySelector('#countrysearch').oninput=u;document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{countryRegion=b.dataset.region;document.querySelectorAll('[data-region]').forEach(x=>x.classList.toggle('selected',x===b));u()});u()}
if(view==='numbers'){e.innerHTML=`<h2>Numbers you can use.</h2><p class="muted">Counting, order, prices, dates and everyday quantities.</p><div class="number-converter panel"><label for="numberinput"><strong>Write a number. Read it in English.</strong></label><input type="number" id="numberinput" min="0" max="999999" step="1" value="48" inputmode="numeric" aria-describedby="numberhelp"><p class="small muted" id="numberhelp">Whole numbers from 0 to 999,999 · British English style</p><p id="numberoutput" role="status"></p></div><h3>Start with 0–20</h3><div class="number-grid">${numberWords.map((w,n)=>`<div><b>${n}</b><span>${w}</span></div>`).join('')}</div><div class="everyday-columns"><article class="panel"><h3>Tens & bigger numbers</h3><div class="table-wrap"><table><tbody>${[[30,'thirty'],[40,'forty'],[50,'fifty'],[60,'sixty'],[70,'seventy'],[80,'eighty'],[90,'ninety'],[100,'a hundred / one hundred'],[101,'a hundred and one'],[250,'two hundred and fifty'],['1,000','a thousand'],['1,000,000','a million']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></article><article class="panel"><h3>Common patterns</h3><p>Use a hyphen in written compound numbers: twenty-one, thirty-five, ninety-nine. Use hundred/thousand/million without -s after a specific number.</p>${tr('Metti un trattino nei numeri composti scritti in lettere: twenty-one. Dopo un numero preciso hundred, thousand e million non prendono -s.')}<div class="example">two hundred people<br>hundreds of people<br>three thousand tickets</div><div class="mistake">forty (not fourty) · fifteen ≠ fifty · thirteen ≠ thirty</div></article></div><h2>Cardinal or ordinal?</h2><div class="compare-pair"><div><strong>How many? → Cardinal</strong><p>one, two, three<br>We need three tickets.</p>${tr('I cardinali esprimono una quantità: uno, due, tre. Ci servono tre biglietti.')}</div><div><strong>Which position? → Ordinal</strong><p>first, second, third<br>Our room is on the third floor.</p>${tr('Gli ordinali esprimono una posizione: primo, secondo, terzo. La nostra camera è al terzo piano.')}</div></div><a class="btn secondary" href="#everyday/calendar">Dates, ordinal numbers & telling the time ↗</a><div class="section-head"><h2>Numbers in real life.</h2></div><div class="ref-grid">${[
['Age','How old are you? → I’m forty-eight (years old).','Per l’età usa be: I’m forty-eight, non I have forty-eight years.'],
['Prices','€14.50 → fourteen euros fifty / fourteen fifty (when the currency is clear).','Per i prezzi puoi dire la valuta o ometterla se è chiara dal contesto.'],
['Decimals & percentages','3.14 → three point one four. / 25% → twenty-five per cent.','Il punto separa i decimali; dopo point leggi normalmente ogni cifra separatamente.'],
['Thousands & decimal marks','1,250.75 → one thousand two hundred and fifty point seven five.','Nella scrittura inglese la virgola può separare le migliaia e il punto i decimali.'],
['Fractions','½ → a half / ¼ → a quarter / ¾ → three quarters.','Half indica metà, quarter un quarto. Il numeratore maggiore di uno richiede normalmente il plurale.'],
['Phone numbers & room numbers','Call 020 7150 → oh two oh, seven one five oh. / Room 204 → room two oh four.','I numeri di telefono si leggono normalmente cifra per cifra. Zero può essere letto oh, soprattutto nei numeri di telefono.'],
['Years','1998 → nineteen ninety-eight. / 2026 → twenty twenty-six.','Gli anni hanno spesso una lettura a coppie; esistono anche altre letture corrette.'],
['Quantities & measures','two kilos of flour / one and a half litres of water / a dozen eggs.','Kilo e litre prendono il plurale; a dozen significa dodici.']
].map(([title,en,it])=>`<article class="panel"><h3>${title}</h3><p>${en}</p>${tr(it)}</article>`).join('')}</div><div class="note">How much / how many connect numbers and grammar. <a href="#grammar/quantifiers"><u>Open the quantifier summary ↗</u></a></div><details class="source-note"><summary>Further reading</summary><p><a href="https://dictionary.cambridge.org/grammar/british-grammar/number" target="_blank" rel="noopener">Cambridge: number expressions</a>. Examples and explanations written for this study book.</p></details>`;const u=()=>{const value=document.querySelector('#numberinput').value;const n=Number(value);document.querySelector('#numberoutput').textContent=value!==''&&Number.isInteger(n)&&n>=0&&n<=999999?cardinal(n):'Enter a whole number between 0 and 999,999.'};document.querySelector('#numberinput').oninput=u;u()}}
coverageGroups[0][1].forEach(row=>{if(row[0]==='Modal verbs')row[2]='verbs/modals';if(row[0]==='Imperatives & let’s')row[2]='verbs/imperative';if(row[0]==='Quantifiers')row[2]='grammar/quantifiers'});
coverageGroups[0][1].push(['Regular verb forms','98 useful regular verbs with past forms and examples','verbs/regular']);
coverageGroups[2][1].push(['Adjectives & feelings','120 descriptive words, including 30 feelings','adjectives/atlas'],['Countries & nationalities','Continents, countries, nationality words and language examples','everyday/world'],['Numbers in use','Cardinals, ordinals, prices, fractions and percentages','everyday/numbers']);
const expandedRoute=route;
route=function(){expandedRoute();const parts=(location.hash.slice(1)||'home').split('/');if(parts[0]==='grammar'&&parts[1]==='quantifiers')quantityReference();if(parts[0]==='grammar'&&parts.length===1){document.querySelector('.grammar-overview').insertAdjacentHTML('afterend','<div class="note"><strong>Quantity at a glance:</strong> <a href="#grammar/quantifiers"><u>much, many, a lot of, some, any, a few, a little ↗</u></a></div>')}};
