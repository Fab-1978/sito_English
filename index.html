.block{display:block;margin-top:10px}.regular-table{border:1px solid var(--line);background:#fffefa;border-radius:5px;overflow:auto}.regular-heading,.regular-row>summary{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:12px;padding:13px 18px;min-width:600px;color:var(--ink)}.regular-heading{font-size:10px;background:#e9efe1;font-weight:700;letter-spacing:.6px}.regular-row{margin:0;border-bottom:1px solid var(--line)}.regular-row:last-child{border:0}.regular-row>summary{list-style:none;font-size:12px;cursor:pointer}.regular-row>summary::-webkit-details-marker{display:none}.regular-row>summary b{float:right;color:#a76f49}.regular-row>summary:hover{background:#f0f3e9}.regular-example{padding:15px 20px;background:#edf1e5;color:#607654;font-size:13px;min-width:600px}.imperative-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.imperative-grid .word{padding:18px}.imperative-grid strong{font-size:13px}.world-regions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.world-regions .calendar-item>span{font-size:30px;display:block;margin-bottom:8px}.number-converter{margin-top:25px;background:#eaf0e3}.number-converter label{display:block}.number-converter input{padding:11px 14px;width:220px;max-width:100%;margin-top:15px;border:1px solid #bbc9b0;border-radius:4px;background:#fffefa;color:var(--ink)}#numberoutput{font:32px Georgia,serif;margin:14px 0 0;line-height:1.4}.number-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:15px 0 30px}.number-grid>div{padding:14px;background:#fffefa;border:1px solid var(--line);border-radius:4px}.number-grid b{font:27px Georgia;color:#a4714d;display:block}.number-grid span{font-size:11px;display:block;margin-top:7px}#countryrows td{font-size:12px}@media(max-width:1050px){.world-regions{grid-template-columns:repeat(3,1fr)}.number-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:700px){.imperative-grid{grid-template-columns:1fr}.world-regions{grid-template-columns:1fr 1fr}.number-grid{grid-template-columns:repeat(3,1fr)}#numberoutput{font-size:28px}.regular-heading,.regular-row>summary{padding:12px;font-size:11px}.regular-heading{font-size:9px}}

const lessons=[
{title:'People & everyday life',level:'A2',tag:'Grammar',desc:'Talk about who you are and the people around you.',it:'Parla di te e delle persone che ti circondano.',rule:'Use be for identity and feelings. Use possessive adjectives before a noun: my, your, his, her, its, our, their. Adjectives go before nouns or after be, and do not change in the plural.',rit:'Usa be per identità e stati d’animo. Gli aggettivi possessivi precedono il nome. Gli aggettivi qualificativi vanno prima del nome o dopo be e non cambiano al plurale.',examples:['My daughter is happy. → Is your daughter happy?','They are friendly people. → They aren’t tired.','It is an easy exercise. → Is it an easy exercise?'],words:[['daughter','figlia'],['husband','marito'],['wife','moglie'],['neighbour','vicino di casa'],['tired','stanco'],['worried','preoccupato']],dialog:['Hi! Are you here with your family?','Yes, this is my wife and this is our daughter.','Lovely to meet you. Is this your first visit?','Yes, we are very happy to be here.'],dit:'Ciao! Sei qui con la tua famiglia? / Sì, questa è mia moglie e questa è nostra figlia. / Piacere di conoscervi. È la vostra prima visita? / Sì, siamo molto felici di essere qui.',reading:'My name is Emma. I live with my husband and our daughter, Lucy. Our neighbours are friendly. Lucy is six and she is very curious. Today we are happy because it is her birthday.',q:[['My friends ___ happy.',['is','are','am'],1,'Friends is plural: use are.'],['Is it ___?',['an exercise easy','an easy exercise','a easy exercise'],1,'Adjective + noun; an before the vowel sound in easy.'],['Who is six?',['Emma','Lucy','The neighbour'],1,'The text says Lucy is six.']],write:'Introduce your family in four sentences. Use our, my and an adjective.',wit:'Presenta la tua famiglia in quattro frasi. Usa our, my e un aggettivo.',model:'I live with my wife and our daughter. My daughter is six. She is curious. We are a happy family.'},
{title:'Routines & free time',level:'A2',tag:'Verbs',desc:'Describe habits, hobbies and a typical day.',it:'Descrivi abitudini, hobby e una giornata tipica.',rule:'Use the present simple for routines. Add -s or -es with he, she and it. Make questions with do/does and negatives with don’t/doesn’t + base verb. Put usually before a main verb, but after be.',rit:'Il present simple descrive abitudini. Alla terza persona singolare aggiungi -s o -es. Dopo does e doesn’t il verbo torna alla forma base. Usually precede il verbo principale, ma segue be.',examples:['She works in town. → Does she work in town?','I usually walk after lunch.','He doesn’t drink coffee. / He is usually busy.'],words:[['wake up','svegliarsi'],['have breakfast','fare colazione'],['go for a walk','fare una passeggiata'],['twice a week','due volte a settimana'],['cook','cucinare'],['free time','tempo libero']],dialog:['What do you do in your free time?','I enjoy cooking and taking photos.','Does your daughter like cooking too?','Yes, we usually make pizza on Saturdays.'],dit:'Cosa fai nel tempo libero? / Mi piacciono la cucina e la fotografia. / Anche a tua figlia piace cucinare? / Sì, di solito facciamo la pizza il sabato.',reading:'Ben works from Monday to Friday. He usually gets up at seven. On Saturday he takes photos in the park. He does not work on Sunday, so he cooks lunch with his family.',q:[['She ___ breakfast at seven.',['have','has','having'],1,'She takes the third-person form has.'],['Does he ___ on Sundays?',['works','work','working'],1,'After does, use the base verb.'],['When does Ben take photos?',['On Saturday','On Monday','Every morning'],0,'He takes photos in the park on Saturday.']],write:'Write five sentences about your routine and one question for a friend.',wit:'Scrivi cinque frasi sulla tua routine e una domanda a un amico.',model:'I get up at seven. I work in the morning. I usually walk after lunch. I cook in the evening. I don’t work on Sunday. What do you do at weekends?'},
{title:'What’s happening now?',level:'A2',tag:'Grammar',desc:'Compare your daily routine with the present moment.',it:'Confronta le abitudini con ciò che sta succedendo ora.',rule:'Use am/is/are + verb-ing for actions happening now or temporary situations. Use the present simple for habits. Stative verbs such as know, want and like normally use the simple form.',rit:'Usa am/is/are + verbo in -ing per azioni in corso e situazioni temporanee. Per le abitudini usa il present simple. Verbi come know, want e like normalmente non usano la forma continua.',examples:['I usually cook, but today my wife is cooking.','What are you reading?','I want a coffee. (Not: I am wanting a coffee.)'],words:[['right now','proprio adesso'],['at the moment','al momento'],['wait for','aspettare'],['wear','indossare'],['look for','cercare'],['rain','piovere']],dialog:['What are you doing?','I’m looking for our tickets.','Are they in your bag?','Yes! And the train is arriving now.'],dit:'Cosa stai facendo? / Sto cercando i nostri biglietti. / Sono nella tua borsa? / Sì! E il treno sta arrivando adesso.',reading:'It is raining today. Sara usually walks to work, but today she is taking the bus. She is reading a book while she waits. She likes stories about travel.',q:[['Look! It ___.',['rains','is raining','rain'],1,'Look directs attention to an action happening now.'],['I ___ the answer.',['am knowing','know','knowing'],1,'Know normally uses a simple tense.'],['How is Sara travelling today?',['On foot','By train','By bus'],2,'Today she is taking the bus.']],write:'Describe three things happening now and two things you usually do.',wit:'Descrivi tre azioni in corso e due tue abitudini.',model:'I am studying English. My family is watching TV. It is getting dark. I usually study after dinner. I read every day.'},
{title:'Food & family meals',level:'A2',tag:'Vocabulary',desc:'Shop for ingredients and order a meal.',it:'Compra gli ingredienti e ordina un pasto.',rule:'Countable nouns have singular and plural forms: an apple, two apples. Uncountable nouns such as water, flour and rice do not normally take a plural. Use some in positive statements; any in most questions and negatives. Use some in offers and requests. Use much with uncountable nouns and many with plural countable nouns.',rit:'I nomi numerabili hanno singolare e plurale. Water, flour e rice sono normalmente non numerabili. Some si usa nelle affermazioni e anche nelle offerte/richieste; any nella maggior parte delle domande e delle negazioni. Much con non numerabili, many con numerabili plurali.',examples:['We need some flour and three eggs.','How much water? / How many tomatoes?','Would you like some tea? / We haven’t got any milk.'],words:[['flour','farina'],['dough','impasto'],['a slice','una fetta'],['a bottle of water','una bottiglia d’acqua'],['bill','conto'],['main course','piatto principale']],dialog:['Are you ready to order?','Yes. Could we have two pizzas and a salad, please?','Anything to drink?','A bottle of still water, please.'],dit:'Siete pronti per ordinare? / Sì. Potremmo avere due pizze e un’insalata? / Qualcosa da bere? / Una bottiglia d’acqua naturale, per favore.',reading:'We are making pizza tonight. There is some flour in the cupboard, but there are not any tomatoes. We need to buy six tomatoes and a bottle of olive oil. We already have enough cheese.',q:[['How ___ flour do we need?',['many','much','any'],1,'Flour is uncountable.'],['Would you like ___ tea?',['some','any','many'],0,'Some is natural in an offer.'],['What do they need to buy?',['Cheese and flour','Tomatoes and olive oil','Water and rice'],1,'The shopping list includes tomatoes and olive oil.']],write:'Write a short shopping list and a polite restaurant order.',wit:'Scrivi una breve lista della spesa e un ordine cortese al ristorante.',model:'We need some rice, four apples and a bottle of water. Could I have the chicken and a salad, please?'},
{title:'A weekend to remember',level:'A2',tag:'Verbs',desc:'Tell a story about a past trip.',it:'Racconta un viaggio passato.',rule:'Use the past simple for finished past events. Regular verbs end in -ed; irregular forms must be learned. Use did/didn’t + base verb for questions and negatives. Be has its own forms: was/were, wasn’t/weren’t.',rit:'Il past simple descrive eventi conclusi nel passato. I verbi regolari terminano in -ed; quelli irregolari hanno forme proprie. Dopo did/didn’t usa la forma base. Be usa was/were anche nelle domande e nelle negazioni.',examples:['We visited the museum yesterday.','Did you go by train? → We didn’t go by car.','The hotel was quiet. → Were the rooms clean?'],words:[['yesterday','ieri'],['last weekend','lo scorso fine settimana'],['journey','viaggio, tragitto'],['arrive','arrivare'],['leave → left','partire → passato left'],['buy → bought','comprare → passato bought']],dialog:['How was your weekend?','It was great. We went to the seaside.','Did you swim?','No, we didn’t. We walked along the beach.'],dit:'Com’è stato il fine settimana? / Fantastico. Siamo andati al mare. / Avete nuotato? / No. Abbiamo camminato sulla spiaggia.',reading:'Last weekend we went to a small town by train. We arrived at ten and visited a castle. Our daughter loved the garden. We had lunch in a café and came home in the evening.',q:[['Did you ___ the castle?',['visited','visit','visiting'],1,'Did is followed by the base form.'],['We ___ home at eight.',['come','came','comed'],1,'Come has the irregular past form came.'],['What did their daughter love?',['The train','The café','The garden'],2,'Their daughter loved the garden.']],write:'Write five sentences about your last weekend, including one negative.',wit:'Scrivi cinque frasi sullo scorso fine settimana, compresa una negativa.',model:'Last Saturday we went to the park. We took some photos. We had lunch outside. We didn’t visit the museum. It was a lovely day.'},
{title:'Travel with confidence',level:'A2',tag:'Dialogues',desc:'Ask for directions, check in and make requests.',it:'Chiedi indicazioni, fai il check-in e formula richieste.',rule:'Use Could you…? and Could I…? for polite requests. Use the imperative for directions: go straight, turn left. There is + singular; there are + plural. Prepositions describe location: next to, opposite, between.',rit:'Could you…? e Could I…? esprimono richieste cortesi. L’imperativo si usa per le indicazioni. There is precede il singolare, there are il plurale. Le preposizioni descrivono la posizione.',examples:['Could you tell me where the station is?','Go straight and turn right at the lights.','There is a pharmacy opposite the hotel.'],words:[['booking','prenotazione'],['single ticket','biglietto di sola andata'],['return ticket','biglietto di andata e ritorno'],['platform','binario'],['on foot','a piedi'],['luggage','bagagli']],dialog:['Hello. I have a booking under Rossi.','Welcome. Could I see your passport, please?','Of course. What time is breakfast?','From seven to ten, in the room next to reception.'],dit:'Buongiorno. Ho una prenotazione a nome Rossi. / Benvenuto. Potrei vedere il passaporto? / Certo. A che ora è la colazione? / Dalle sette alle dieci, nella sala accanto alla reception.',reading:'The hotel is opposite the station. There is a supermarket next to it. To get to the museum, leave the hotel, turn left and walk for five minutes. The museum is on your right.',q:[['___ I have a return ticket, please?',['Could','Do','Am'],0,'Could I…? is a polite request.'],['There ___ two parks nearby.',['is','are','be'],1,'Use are with a plural noun.'],['Where is the hotel?',['Behind the museum','Opposite the station','Inside the supermarket'],1,'The hotel is opposite the station.']],write:'Write a hotel request and directions from your home to a nearby place.',wit:'Scrivi una richiesta in hotel e le indicazioni da casa a un luogo vicino.',model:'Could we have a quiet room, please? To get to the park, go straight and turn left. It is opposite the school.'},
{title:'Plans & possibilities',level:'A2+',tag:'Verbs',desc:'Make plans, arrangements and predictions.',it:'Esprimi intenzioni, accordi e previsioni.',rule:'Use be going to for intentions and predictions based on present evidence. Use the present continuous for arranged future plans. Use will for spontaneous decisions, offers and predictions based on opinion.',rit:'Be going to esprime intenzioni e previsioni basate su indizi presenti. Il present continuous esprime programmi già organizzati. Will si usa per decisioni immediate, offerte e previsioni basate su opinioni.',examples:['We’re going to visit London next year.','We’re meeting Anna at six. (It is arranged.)','That bag looks heavy. I’ll help you.'],words:[['next month','il prossimo mese'],['book a room','prenotare una camera'],['plan ahead','organizzarsi in anticipo'],['forecast','previsione'],['perhaps','forse'],['arrangement','accordo, programma organizzato']],dialog:['What are you doing this weekend?','We’re meeting some friends on Saturday.','That sounds nice. Shall I bring a cake?','Yes, please! I’ll make some tea.'],dit:'Cosa fai questo fine settimana? / Sabato incontriamo degli amici. / Bello. Porto una torta? / Sì, grazie! Preparo il tè.',reading:'We have booked our train tickets to Rome for Friday. We are staying with friends. We are going to visit a museum if we have time. I think our daughter will enjoy the trip.',q:[['The phone is ringing. I ___ answer it.',['will','am','did'],0,'Will expresses a decision made now.'],['We ___ Anna at six; we have arranged it.',['met','are meeting','meets'],1,'Present continuous can express an arrangement.'],['Where are they staying?',['In a hotel','With friends','At a campsite'],1,'The text says they are staying with friends.']],write:'Describe an intention, an arrangement and an offer.',wit:'Descrivi un’intenzione, un programma concordato e un’offerta.',model:'I’m going to study more English. I’m meeting a friend tomorrow at five. I’ll help you with your bags.'},
{title:'Comparing & choosing',level:'A2+',tag:'Grammar',desc:'Compare places, experiences and everyday choices.',it:'Confronta luoghi, esperienze e scelte quotidiane.',rule:'Use -er/-est with many short adjectives and more/most with most longer adjectives. Add than after a comparative. Use the before a superlative. Irregular forms include good → better → best and bad → worse → worst. As…as expresses equality.',rit:'Molti aggettivi brevi usano -er/-est; quelli lunghi generalmente more/most. Than introduce il secondo termine di paragone. Il superlativo è preceduto da the. As…as esprime uguaglianza.',examples:['This hotel is cheaper than that one.','It is the most comfortable room.','The train is as fast as the bus today.'],words:[['crowded','affollato'],['quiet','tranquillo'],['comfortable','comodo'],['expensive','costoso'],['better','migliore'],['the worst','il peggiore']],dialog:['Which hotel do you prefer?','The smaller one. It is quieter.','But the other one is closer to the beach.','True, but this is the best choice for our budget.'],dit:'Quale hotel preferisci? / Quello più piccolo. È più tranquillo. / Ma l’altro è più vicino alla spiaggia. / Vero, ma questo è la scelta migliore per il nostro budget.',reading:'Hotel Green costs €80 a night and is ten minutes from the beach. Hotel Blue costs €110 and is two minutes away. Green has larger rooms, but Blue has the best sea views.',q:[['This room is ___ than ours.',['biggest','bigger','more big'],1,'Big doubles the final consonant: bigger.'],['It is ___ interesting museum in town.',['the most','more','most than'],0,'Use the most with a long adjective.'],['Which hotel is cheaper?',['Blue','They cost the same','Green'],2,'Green costs €80; Blue costs €110.']],write:'Compare two places you know using three comparatives and one superlative.',wit:'Confronta due luoghi con tre comparativi e un superlativo.',model:'The village is quieter than the city. The city is bigger and more crowded. The village has the best views.'},
{title:'Experiences & recent news',level:'B1',tag:'Verbs',desc:'Connect past experiences to the present.',it:'Collega esperienze passate al presente.',rule:'Use have/has + past participle for experiences without a finished past time, recent news and situations continuing now. Use the past simple with finished times such as yesterday or in 2020. Since marks a starting point; for marks a duration. Been often means visited and returned; gone means away now.',rit:'Il present perfect usa have/has + participio passato per esperienze senza un momento passato concluso, notizie recenti e situazioni ancora attuali. Con yesterday o in 2020 usa il past simple. Since indica l’inizio, for la durata. Been indica spesso una visita conclusa; gone una persona ancora via.',examples:['Have you ever been to London? → Yes, I went in 2022.','I have lived here for ten years / since 2016.','She has just finished her homework.'],words:[['ever','mai (nelle domande)'],['never','mai (negazione)'],['already','già'],['yet','già / ancora (domande e negazioni)'],['just','appena'],['so far','finora']],dialog:['Have you ever tried making fresh pasta?','Yes, I have. I made it last Christmas.','Have you bought a pasta machine yet?','No, I haven’t. I’m still choosing one.'],dit:'Hai mai provato a fare la pasta fresca? / Sì. L’ho fatta lo scorso Natale. / Hai già comprato una macchina per la pasta? / No. La sto ancora scegliendo.',reading:'Julia has lived in this town for five years. She moved here in 2021. She has already visited the local museums, but she has not tried the new restaurant yet. Yesterday she booked a table for Saturday.',q:[['We ___ there last year.',['have gone','went','have been'],1,'Last year is a finished past time: use past simple.'],['I have known her ___ 2019.',['for','since','during'],1,'Since introduces a starting point.'],['What hasn’t Julia done yet?',['Visited the museums','Booked a table','Tried the new restaurant'],2,'She has not tried the restaurant yet.']],write:'Write two life experiences, then say when one happened using the past simple.',wit:'Scrivi due esperienze e specifica quando ne è avvenuta una usando il past simple.',model:'I have visited France. I have tried skiing. I visited France last summer with my family.'},
{title:'Stories in progress',level:'B1',tag:'Verbs',desc:'Set the scene and describe interruptions.',it:'Descrivi lo sfondo di una storia e le interruzioni.',rule:'Use was/were + verb-ing for an action in progress at a past time. Use the past simple for a completed event that happens during it. While often introduces a longer action; when often introduces the interrupting event.',rit:'Was/were + verbo in -ing descrive un’azione in corso nel passato. Il past simple indica un evento concluso che avviene durante quell’azione. While introduce spesso lo sfondo, when l’evento che interrompe.',examples:['I was cooking when the phone rang.','While we were walking, it started to rain.','What were you doing at eight last night?'],words:[['suddenly','all’improvviso'],['while','mentre'],['notice','notare'],['happen','accadere'],['miss the train','perdere il treno'],['luckily','per fortuna']],dialog:['Why were you late?','We were driving to the station when we got lost.','Did you miss the train?','Luckily, no. The train was late too!'],dit:'Perché eravate in ritardo? / Stavamo guidando verso la stazione quando ci siamo persi. / Avete perso il treno? / Per fortuna no. Anche il treno era in ritardo!',reading:'Yesterday at six, Tom was walking home. While he was crossing the park, he saw a small dog. It was sitting under a tree. Tom called the number on its collar and the owner came to collect it.',q:[['I was reading when she ___.',['arrived','was arrive','arriving'],0,'Use past simple for the completed arrival.'],['They ___ sleeping at midnight.',['was','were','did'],1,'They takes were.'],['How did Tom contact the owner?',['He sent a letter','He called a number','He went to the station'],1,'He called the number on the collar.']],write:'Tell a short story using while and when.',wit:'Racconta una breve storia usando while e when.',model:'We were visiting a town when it started to rain. While we were looking for a café, we met an old friend.'},
{title:'Advice & real possibilities',level:'B1',tag:'Grammar',desc:'Give advice, explain rules and discuss possible results.',it:'Dai consigli, spiega regole e parla di risultati possibili.',rule:'Use should + base verb for advice; have to for necessity. Mustn’t means prohibited; don’t have to means not necessary. In the first conditional use if + present simple, then will + base verb for a possible future result. Do not normally use will in the if-clause.',rit:'Should dà consigli; have to esprime necessità. Mustn’t significa vietato, don’t have to significa non necessario. Nel first conditional: if + present simple, will + verbo base per una conseguenza futura possibile. Normalmente non usare will nella proposizione con if.',examples:['You should book early.','You mustn’t park here. / You don’t have to pay on Sundays.','If it rains, we’ll visit the museum.'],words:[['advice','consigli (non numerabile)'],['allowed','permesso'],['necessary','necessario'],['instead','invece'],['unless','a meno che / se non'],['in case','nel caso in cui, per precauzione']],dialog:['What should we do if it rains?','If it rains, we’ll go to the aquarium.','Do we have to book?','Yes, we should book online today.'],dit:'Cosa dovremmo fare se piove? / Se piove andremo all’acquario. / Dobbiamo prenotare? / Sì, dovremmo prenotare online oggi.',reading:'The family is planning a day out. If the weather is sunny, they will have a picnic. If it rains, they will visit a museum. Children do not have to pay at the museum, but visitors must not take photos inside.',q:[['If we ___ early, we’ll catch the bus.',['leave','will leave','left'],0,'Use present simple after if in a first conditional.'],['You don’t have to pay means…',['Payment is forbidden','Payment is not necessary','Payment is required'],1,'Don’t have to expresses absence of necessity.'],['What is prohibited in the museum?',['Bringing children','Taking photos','Buying tickets'],1,'Visitors must not take photos inside.']],write:'Give a friend two travel tips and write a plan for bad weather.',wit:'Dai due consigli di viaggio e scrivi un piano in caso di maltempo.',model:'You should book your tickets early. You should bring comfortable shoes. If it rains, we’ll visit an indoor market.'},
{title:'Connect & express yourself',level:'B1',tag:'Writing',desc:'Link ideas and write a friendly message.',it:'Collega le idee e scrivi un messaggio informale.',rule:'Use because for a reason, so for a result, but and although for contrast. Do not use although and but for the same link. Relative clauses with who describe people; which describes things; that can describe either in defining clauses. After enjoy and prepositions, use the -ing form.',rit:'Because introduce il motivo, so la conseguenza; but e although il contrasto. Non usare insieme although e but per lo stesso collegamento. Who descrive persone; which cose; that può sostituirli nelle relative determinative. Dopo enjoy e dopo preposizioni usa -ing.',examples:['Although it was cold, we went for a walk.','This is the café that serves homemade cakes.','I enjoy cooking. / I’m interested in learning English.'],words:[['by the way','a proposito'],['looking forward to','non vedere l’ora di'],['however','tuttavia'],['homemade','fatto in casa'],['keep in touch','restare in contatto'],['let me know','fammi sapere']],dialog:['What did you think of the trip?','Although the weather was bad, we had a great time.','What was your favourite part?','The market, because I enjoy trying local food.'],dit:'Cosa ne pensi del viaggio? / Anche se il tempo era brutto, ci siamo divertiti molto. / Qual è stata la parte preferita? / Il mercato, perché mi piace assaggiare il cibo locale.',reading:'Hi Alex, we are having a lovely holiday! Although our hotel is small, it is very comfortable. Yesterday we met a family who live near us. We went to a café that makes wonderful cakes. I’m looking forward to showing you the photos. See you soon, Sam.',q:[['I enjoy ___ new places.',['visit','visiting','to visiting'],1,'Enjoy is followed by -ing.'],['The woman ___ helped us was very kind.',['which','who','where'],1,'Who refers to a person.'],['What is Sam looking forward to?',['Moving house','Buying a hotel','Showing Alex the photos'],2,'Sam says he is looking forward to showing the photos.']],write:'Write a 60–80 word message about a trip. Include because, although and one relative clause.',wit:'Scrivi un messaggio di 60–80 parole su un viaggio. Includi because, although e una relativa.',model:'Hi Anna, we are enjoying our holiday by the sea. Although the weather was cloudy yesterday, we explored a lovely village. We found a restaurant that serves fresh fish. Our daughter loved the beach because there were lots of shells. Today we are going to visit a castle. I’m looking forward to showing you our photos when we get home. See you soon!'}
];

const verbGuides=[
['forms','The five verb forms','A2','A verb has a base form, a third-person singular form, a past form, a past participle and an -ing form. These are building blocks, not five separate tenses.','Un verbo ha forma base, terza persona singolare, passato, participio passato e forma in -ing. Sono elementi con cui costruire tempi e strutture, non cinque tempi distinti.',['Base: walk / take → We walk to school.','Third person: walks / takes → She takes the bus.','Past: walked / took → We took a train yesterday.','Past participle: walked / taken → I have taken some photos.','-ing: walking / taking → We are walking home.'],'Do not confuse the past form with the past participle: went ≠ gone.'],
['spelling','Regular verbs & spelling','A2','Regular past forms and past participles end in -ed. Add -d after e; change consonant + y to -ied. For -ing, usually remove a final silent e. Double a final consonant after a stressed short vowel in forms such as stopped and running.','Nei verbi regolari passato e participio terminano in -ed. Dopo e basta -d; consonante + y diventa -ied. Per -ing di solito si elimina la e muta finale. Una consonante finale si raddoppia dopo una vocale breve accentata in forme come stopped e running.',['live → lived → living','study → studied → studying','play → played → playing','stop → stopped → stopping','-ed sounds: walked /t/ · cleaned /d/ · wanted /ɪd/'],'The -ed ending is an extra syllable only after /t/ or /d/.'],
['auxiliary','Be, do & have','A2','Be, do and have can be main verbs or helpers. Be builds continuous forms and the passive; have builds perfect forms. Do builds questions and negatives in the present and past simple, except with main verb be or modal verbs.','Be, do e have possono avere significato proprio o essere ausiliari. Be costruisce le forme continue e il passivo; have i tempi perfetti. Do costruisce domande e negazioni al present e past simple, tranne con be e i modali.',['I am a parent. / I am making lunch.','We have a car. / We have booked a room.','Do you have a ticket? / She doesn’t have a car.','Are you ready? / Did you enjoy the trip?'],'After does or did, use the base form: Does she work? Did you go?'],
['modals','Modal verbs','A2–B1','Can expresses ability or permission; could can express past ability or a polite request. Should gives advice. Must and have to express necessity; might expresses possibility. Core modal verbs take a base verb without to and do not add -s.','Can esprime capacità o permesso; could capacità passate o richieste cortesi. Should dà consigli. Must e have to esprimono necessità; might possibilità. I modali principali reggono il verbo base senza to e non aggiungono -s.',['She can swim. → Can she swim? → She can’t swim.','You should take a jacket. / It might rain.','You mustn’t enter. = Entry is prohibited.','You don’t have to book. = Booking is not necessary.','Do you have to leave? (Have to uses do in simple-tense questions.)'],'Say she can, not she cans; can go, not can to go.'],
['patterns','Infinitive or -ing?','A2–B1','Learn a verb together with the pattern that follows it. Want, decide and hope take to + verb; enjoy and avoid take -ing. A preposition normally takes a noun or an -ing form. After let, use object + base verb.','Impara i verbi insieme alla costruzione che segue. Want, decide e hope reggono to + verbo; enjoy e avoid la forma in -ing. Dopo una preposizione si usa normalmente un nome o -ing. Dopo let usa oggetto + forma base.',['We decided to stay another night.','I enjoy taking photos. / Avoid driving at rush hour.','She is interested in learning English.','Let’s try the local food. / Let me help you.'],'Look forward to + -ing: I look forward to seeing you. Here to is a preposition.'],
['state','Actions, states & phrasal verbs','B1','Action verbs often allow simple and continuous forms. State verbs such as know, believe and want normally use simple forms. Some verbs change meaning: I think means I believe; I’m thinking means I’m considering. Learn phrasal verbs as a whole expression.','I verbi d’azione consentono spesso forme semplici e continue. Verbi di stato come know, believe e want usano normalmente forme semplici. Alcuni cambiano significato: I think significa penso/ritengo; I’m thinking sto riflettendo. Impara i phrasal verbs come espressioni complete.',['I know this town. / I’m looking for the station.','I think this hotel is good. / I’m thinking about our holiday.','Please turn off the light. / Please turn it off.','We get on the bus and get off at the museum.'],'With a separable phrasal verb, a pronoun goes in the middle: turn it off.'],
['passive','A first look at the passive','B1','Use be + past participle when the action or result matters more than who performs it. The tense is shown by be. Add by + person only when useful.','Usa be + participio passato quando conta più l’azione o il risultato di chi la compie. Il tempo è espresso da be. Aggiungi by + persona solo quando serve.',['Present: Breakfast is served at eight.','Past: The bridge was built in 1950.','Active: The chef prepared the meal. → Passive: The meal was prepared by the chef.'],'Use the past participle: was written, not was wrote.']
];
const tenseGuides=[
['Present simple','A2','Habits, facts and states','Abitudini, fatti e stati','Subject + base verb (-s with he/she/it)','I walk. / She walks.','I don’t walk. / She doesn’t walk.','Do you walk? / Does she walk?','usually · every day · often','She usually walks to work.','Don’t add -s after does.'],
['Present continuous','A2','Actions now and temporary situations','Azioni in corso e situazioni temporanee','Subject + am/is/are + -ing','She is cooking.','She isn’t cooking.','Is she cooking?','now · at the moment · today','We are staying with friends this week.','Use be: I am studying, not I studying.'],
['Past simple','A2','Finished events in a finished past time','Eventi conclusi in un periodo passato concluso','Subject + past form','We visited Rome. / We went out.','We didn’t visit Rome.','Did you visit Rome?','yesterday · last week · in 2020','We went to the beach yesterday.','Be is different: Was she tired? She wasn’t tired.'],
['Past continuous','B1','An action in progress at a past moment; story background','Un’azione in corso in un momento passato; lo sfondo di un racconto','Subject + was/were + -ing','They were sleeping.','They weren’t sleeping.','Were they sleeping?','while · at eight yesterday','I was cooking when the doorbell rang.','Use past simple for the interrupting completed event.'],
['Present perfect','B1','Experiences, recent results and situations continuing now','Esperienze, risultati recenti e situazioni che continuano','Subject + have/has + past participle','She has visited London.','She hasn’t visited London.','Has she visited London?','ever · never · just · yet · since · for','We have lived here for five years.','Use past simple with a finished past time: I went yesterday.'],
['Will','A2–B1','Offers, immediate decisions and predictions based on opinion','Offerte, decisioni immediate e previsioni basate su opinioni','Subject + will + base verb','I will help you.','I won’t leave.','Will you join us?','I think · probably · perhaps','The phone is ringing. I’ll answer it.','Will has the same form for all subjects.'],
['Be going to','A2–B1','Intentions and predictions based on present evidence','Intenzioni e previsioni basate su indizi presenti','Subject + am/is/are + going to + base verb','We are going to travel.','We aren’t going to travel.','Are you going to travel?','next week · tomorrow (context matters)','Look at those clouds. It’s going to rain.','Keep be in the sentence: We are going to leave.'],
['Future arrangements','A2–B1','Plans already arranged with another person or organisation','Programmi già concordati con persone o organizzazioni','Present continuous + future context','We are meeting Anna tomorrow.','We aren’t meeting Anna tomorrow.','Are you meeting Anna tomorrow?','tomorrow at six · on Friday','We are taking the booked train on Friday.','A future time expression makes the future meaning clear.']

const adjectiveGuides=[
['position','Where adjectives go','A2','An adjective describes a noun. It usually goes before the noun or after a linking verb such as be, seem or look. It does not become plural. In questions, keep the adjective with the noun, or after the subject with be.','Un aggettivo descrive un nome. Di solito precede il nome o segue un verbo come be, seem o look. Non prende il plurale. Nelle domande resta prima del nome, oppure dopo il soggetto nelle costruzioni con be.',['a quiet hotel / two quiet hotels','The hotel is quiet. → Is the hotel quiet?','It is an easy question. → Is it an easy question?'],'Not: an exercise easy; not: happys children.'],
['order','Two or more adjectives','A2–B1','With two adjectives, a personal opinion normally comes before a factual description. Use a natural short combination rather than a long chain. Common patterns include opinion + size and size + colour.','Con due aggettivi, un’opinione personale precede normalmente una caratteristica oggettiva. Preferisci combinazioni brevi e naturali. Sono comuni opinione + dimensione e dimensione + colore.',['a lovely small café','a large blue suitcase','The room is bright and comfortable.'],'After be, use and before the last adjective in a list.'],
['comparison','Comparatives & superlatives','A2–B1','Many short adjectives use -er and -est; longer ones usually use more and most. Use than for the comparison and the before a superlative. As + adjective + as expresses equal degree.','Molti aggettivi brevi usano -er e -est; quelli lunghi in genere more e most. Usa than nel confronto e the prima del superlativo. As + aggettivo + as esprime uguaglianza.',['small → smaller → the smallest','happy → happier → the happiest; big → bigger → the biggest','comfortable → more comfortable → the most comfortable','This room is as quiet as ours. / It is much cheaper than ours.'],'Avoid double comparatives: better, not more better.'],
['manner','From adjective to adverb','A2','Adjectives describe people and things; adverbs of manner describe how an action happens. Many adverbs add -ly: slow → slowly. Change consonant + y to -ily: easy → easily. Friendly is an adjective; say in a friendly way.','Gli aggettivi descrivono persone e cose; gli avverbi di modo descrivono come avviene un’azione. Molti aggiungono -ly. Consonante + y diventa -ily. Friendly è un aggettivo: usa in a friendly way.',['She is a careful driver. / She drives carefully.','The exercise is easy. / She finished it easily.','He speaks English well. / His English is good.'],'After linking verbs use an adjective: The soup tastes good.'],
['frequency','How often?','A2','Frequency adverbs usually go before the main verb, but after main verb be. With an auxiliary, they normally follow the first auxiliary. Expressions such as twice a week usually go at the end.','Gli avverbi di frequenza precedono normalmente il verbo principale, ma seguono be quando è il verbo principale. Con un ausiliare di solito seguono il primo ausiliare. Espressioni come twice a week vanno generalmente alla fine.',['always → usually → often → sometimes → rarely → never','I usually cook. / I am usually early.','We have never visited Scotland.','She goes swimming twice a week.'],'Never is already negative: I never smoke, not I don’t never smoke.'],
['adverb-position','Manner, place & time','A2–B1','Manner adverbs commonly follow the verb and its object. Place and time expressions often come at the end; time can also introduce the sentence. When combined, manner → place → time is a useful default, not an absolute rule.','Gli avverbi di modo seguono spesso verbo e oggetto. Luogo e tempo vanno spesso alla fine; il tempo può anche aprire la frase. Se combinati, modo → luogo → tempo è un ordine di base utile, non una regola assoluta.',['She packed her bag carefully.','We walked slowly through the town yesterday.','Tomorrow, we are travelling to the coast.'],'Do not normally separate a verb and its short object: She speaks English fluently.'],
['degree','Very, too & enough','A2–B1','Very increases degree; too means more than is suitable. Put enough after an adjective or adverb, but before a noun. Use a little or a bit to soften a description.','Very intensifica; too indica una quantità o un grado eccessivo. Enough segue aggettivi e avverbi, ma precede i nomi. A little o a bit attenuano una descrizione.',['The tea is very hot. / The tea is too hot to drink.','This room is big enough for us.','We have enough time. / It is a bit expensive.'],'Say warm enough, not enough warm.'],
['confusing','Words that change the meaning','B1','Some adverbs do not use -ly, and some similar-looking forms have different meanings. Hard can mean with effort; hardly means almost not. Late means after the expected time; lately means recently.','Alcuni avverbi non usano -ly e alcune forme simili hanno significati diversi. Hard indica impegno; hardly significa quasi per niente. Late significa in ritardo; lately recentemente.',['He works hard. / He hardly works.','The train arrived late. / I haven’t travelled much lately.','She runs fast. (Not fastly.)','The film was boring. / I was bored.'],'-ing often describes the cause of a feeling; -ed describes the person experiencing it.']
];

const referenceQuizzes={verbs:[['She ___ to work every day.',['walk','walks','walking'],1,'He/she/it takes -s in the present simple.'],['Did you ___ the tickets?',['bought','buy','buying'],1,'Did takes the base verb.'],['We have ___ our lunch.',['ate','eat','eaten'],2,'Have takes the past participle.'],['You ___ park here. It is prohibited.',['mustn’t','don’t have to','should'],0,'Mustn’t expresses prohibition.'],['I enjoy ___ with my daughter.',['cook','cooking','to cook'],1,'Enjoy is followed by -ing.'],['Look at the dark clouds. It ___ rain.',['is going to','did','has'],0,'Present evidence supports going to.']],adjectives:[['Is it ___?',['an exercise easy','an easy exercise','an easily exercise'],1,'An adjective comes before its noun.'],['She drives ___.',['careful','carefully','care'],1,'Carefully describes how she drives.'],['He is ___ late.',['never','not never','neverly'],0,'Frequency adverbs follow be; never is negative.'],['This bag is ___ than mine.',['more heavy','heavier','heaviest'],1,'Heavy changes y to i: heavier.'],['We ___ know our new neighbours. We have only met once.',['hard','hardly','hardly not'],1,'Hardly means almost not.'],['The room is big ___ for three people.',['too','enough','very'],1,'Enough follows an adjective.']]};

// grammar-data.js
// Original concise reference lessons. Each includes a bilingual rule and two practice questions.
const grammarTopics=[
{title:'Sentence order',group:'Sentence essentials',level:'A2',rule:'A typical statement uses subject + verb + object. English normally needs a subject, including it for weather and time. Keep adjectives before their noun.',it:'Una frase affermativa tipica segue soggetto + verbo + oggetto. In inglese il soggetto è normalmente necessario, anche it per tempo atmosferico e orario. Gli aggettivi precedono il nome.',rows:[['Statement','We eat dinner at seven.'],['With an adjective','We booked a quiet room.'],['Weather and time','It is raining. / It is half past six.']],error:'I like very much pizza → I like pizza very much.',q:[['Choose the natural order.',['I every day English study.','I study English every day.','Study I English every day.'],1,'Use subject + verb + object, then the time expression.'],['___ is cold today.',['It','Is','There'],0,'Weather statements normally need the subject it.']]},
{title:'Negatives, questions & short answers',group:'Sentence essentials',level:'A2',rule:'Put be or an auxiliary before the subject in questions. Add not after be, an auxiliary or a modal for negatives. Present and past simple main verbs usually need do/does/did. Reuse the auxiliary in short answers.',it:'Nelle domande be o l’ausiliare precede il soggetto. Nelle negative not segue be, ausiliare o modale. Per i verbi principali al present e past simple si usa normalmente do/does/did. Nelle risposte brevi riprendi l’ausiliare.',rows:[['Be','Are you ready? → Yes, I am. / No, I’m not.'],['Simple present','Does she cook? → Yes, she does. / No, she doesn’t.'],['Past simple','Did they come? → Yes, they did.'],['Modal','Can he swim? → No, he can’t.']],error:'Does she likes it? → Does she like it?',link:'verbs',q:[['Does your daughter like pizza?',['Yes, she is.','Yes, she does.','Yes, she likes.'],1,'A question with does takes does in the short answer.'],['___ they at home yesterday?',['Did','Was','Were'],2,'Past be with they is were; do is not needed.']]},
{title:'Articles: a, an, the & no article',group:'Nouns & determiners',level:'A2',rule:'Use a/an for one non-specific countable item; choose by sound, not spelling. Use the when the listener can identify the thing. General plural and uncountable nouns often take no article.',it:'A/an indica un elemento numerabile singolare non specifico; scegli in base al suono, non alla lettera. The si usa quando chi ascolta può identificare ciò di cui parli. Per plurali e non numerabili in senso generale spesso non serve l’articolo.',rows:[['First mention → known item','I saw a dog. The dog was very friendly.'],['Sound matters','an hour / a university'],['General meaning','Children need sleep. / I like music.'],['Jobs','She is a teacher.']],error:'I am teacher → I am a teacher.',q:[['We waited for ___ hour.',['a','an','the only'],1,'Hour starts with a vowel sound; h is silent.'],['I like ___ music in general.',['a','the','no article'],2,'Use no article for music in a general sense.']]},
{title:'Plurals & countability',group:'Nouns & determiners',level:'A2',rule:'Most plurals add -s, but some add -es or change form. Uncountable nouns normally have no plural and do not take a/an. Use a unit phrase to count them.',it:'Molti plurali aggiungono -s, alcuni -es o una forma irregolare. I non numerabili normalmente non hanno plurale e non usano a/an. Per contarli usa un’espressione di quantità.',rows:[['Regular','book → books / box → boxes / city → cities'],['Irregular','child → children / person → people / man → men'],['Uncountable','information, advice, luggage, bread'],['Count with a unit','a piece of advice / two slices of bread']],error:'Two informations → two pieces of information.',q:[['The plural of child is…',['childs','children','childes'],1,'Child has the irregular plural children.'],['Could you give me ___?',['an advice','some advices','some advice'],2,'Advice is uncountable; some advice is correct.']]},
{title:'Subject & object pronouns',group:'Pronouns & possession',level:'A2',rule:'Subject pronouns perform the action; object pronouns follow a verb or preposition. It can refer to a thing, an animal or a situation. Use them to avoid repeating nouns.',it:'I pronomi soggetto compiono l’azione; i pronomi complemento seguono un verbo o una preposizione. It può indicare una cosa, un animale o una situazione. I pronomi evitano ripetizioni.',rows:[['Subject → object','I → me / you → you / he → him / she → her'],['Subject → object','it → it / we → us / they → them'],['After a verb','She knows me. / I called them.'],['After a preposition','Come with us. / This is for her.']],error:'She helped I → She helped me.',q:[['Please come with ___.',['we','us','our'],1,'Use an object pronoun after with.'],['Anna is here. ___ is waiting.',['Her','She','Hers'],1,'She is the subject of is waiting.']]},
{title:'My, mine & possessive ’s',group:'Pronouns & possession',level:'A2',rule:'Use my/your/his/her/its/our/their before a noun. Use mine/yours/his/hers/ours/theirs without a following noun. Add ’s to a singular owner, and an apostrophe after a regular plural ending in s.',it:'My/your/his/her/its/our/their precedono il nome. Mine/yours/his/hers/ours/theirs lo sostituiscono. Per un possessore singolare aggiungi ’s; per un plurale regolare in s aggiungi solo l’apostrofo.',rows:[['Before a noun','This is my bag. / That is their car.'],['Without a noun','This bag is mine. / That car is theirs.'],['Possessive ’s','my daughter’s bike / the children’s room'],['Plural owner','my parents’ house']],error:'It’s = it is / it has. Its = belonging to it.',q:[['This is my book. That one is ___.',['your','yours','you'],1,'Yours replaces your book.'],['The room belonging to the children is…',['the childrens room','the children’s room','the childrens’ room'],1,'Children is already plural; add ’s.']]},
{title:'Reflexive pronouns',group:'Pronouns & possession',level:'B1',rule:'Use a reflexive when the subject and object are the same person: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. By myself can mean alone or without help. Do not automatically translate every Italian reflexive verb literally.',it:'Usa un riflessivo quando soggetto e oggetto coincidono: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. By myself può significare da solo o senza aiuto. Non tradurre automaticamente ogni verbo riflessivo italiano con un pronome riflessivo.',rows:[['Same person','I cut myself while cooking.'],['No help','She made the cake by herself.'],['Common expressions','Enjoy yourself! / Help yourselves to some bread.'],['No reflexive needed','I get up at seven. / We feel tired.']],error:'We enjoyed us → We enjoyed ourselves.',q:[['He made dinner by ___.',['him','himself','his'],1,'By himself means alone or without help.'],['We enjoyed ___ at the party.',['ourselves','us','ourself'],0,'The reflexive for we is ourselves.']]},
{title:'This, that, these & those',group:'Nouns & determiners',level:'A2',rule:'Use this/these for things considered near and that/those for things considered more distant. This and that are singular; these and those are plural. They can stand alone or introduce a noun.',it:'This/these indicano cose considerate vicine; that/those cose più lontane. This e that sono singolari; these e those plurali. Possono stare da soli o precedere un nome.',rows:[['Near, singular','This suitcase is mine.'],['Near, plural','These shoes are comfortable.'],['Far, singular','That building is a museum.'],['Far, plural','Those mountains are beautiful.']],error:'This shoes → these shoes.',q:[['___ books here are mine.',['This','These','That'],1,'Books is plural and here suggests nearness.'],['___ hotel over there looks nice.',['Those','These','That'],2,'Hotel is singular; over there suggests distance.']]},
{title:'Some, any, no & compounds',group:'Quantity',level:'A2',rule:'Some is common in positive statements and in offers or requests. Any is common in questions and negatives. No gives a negative meaning without not. Someone, anyone and nobody normally take a singular verb.',it:'Some è comune nelle affermative e nelle offerte o richieste. Any è comune nelle domande e negative. No dà significato negativo senza not. Someone, anyone e nobody reggono normalmente un verbo singolare.',rows:[['Positive / negative','We have some milk. / We don’t have any milk.'],['Offer / question','Would you like some tea? / Is there any tea?'],['No + noun','There is no water.'],['People / things','Someone is outside. / I didn’t buy anything.']],error:'I didn’t see nobody → I didn’t see anybody / I saw nobody.',q:[['Would you like ___ coffee?',['some','no one','many'],0,'Some is natural in an offer.'],['Nobody ___ at home.',['are','is','be'],1,'Nobody normally takes a singular verb.']]},
{title:'Much, many, a few & a little',group:'Quantity',level:'A2',rule:'Many and (a) few go with plural countable nouns; much and (a) little with uncountable nouns. A few/a little mean some; few/little suggest not many/not much, often less than needed. A lot of works with both.',it:'Many e (a) few accompagnano numerabili plurali; much e (a) little non numerabili. A few/a little indicano una piccola quantità presente; few/little sottolineano scarsità, spesso meno del necessario. A lot of va bene con entrambi.',rows:[['Countable','many guests / a few apples / few opportunities'],['Uncountable','much time / a little water / little hope'],['Positive everyday English','We have a lot of time.'],['Compare','We have a little time, so we can talk. / We have little time, so hurry.']],error:'How many money? → How much money?',q:[['We have ___ eggs: just three.',['a little','a few','much'],1,'Eggs is countable and plural.'],['How ___ luggage have you got?',['many','few','much'],2,'Luggage is uncountable.']]},
{title:'Time prepositions: in, on & at',group:'Prepositions',level:'A2',rule:'Use at for clock times, on for days and dates, and in for months, years and parts of the day. Common exceptions include at night. Do not normally add a preposition before last, next, this or every + time expression.',it:'At si usa con gli orari, on con giorni e date, in con mesi, anni e parti della giornata. Un’eccezione comune è at night. Di solito non mettere una preposizione prima di last, next, this o every + espressione temporale.',rows:[['At','at seven / at night / at the weekend (British English)'],['On','on Monday / on 10 July / on Friday morning'],['In','in October / in 2026 / in the evening'],['No preposition','next week / last year / every morning']],error:'On next Monday → next Monday.',q:[['The train leaves ___ 8.30.',['in','on','at'],2,'Use at for a clock time.'],['We are meeting ___ Friday morning.',['on','in','at'],0,'Use on for a particular day and part of that day.']]},
{title:'Place & movement',group:'Prepositions',level:'A2',rule:'In suggests inside an area; on often means on a surface; at often identifies a point or an activity location. To indicates destination, into movement to the inside, and across movement from one side to another.',it:'In indica spesso l’interno di uno spazio; on una superficie; at un punto o luogo di attività. To indica la destinazione, into il movimento verso l’interno, across da un lato all’altro.',rows:[['Location','in the kitchen / on the table / at the bus stop'],['Movement','go to the museum / walk into the room'],['Directions','across the bridge / past the bank / through the park'],['Common expressions','at home / at work / go home / arrive at the station']],error:'Go to home → go home. Arrive to London → arrive in London.',q:[['The keys are ___ the table.',['on','to','into'],0,'On describes a surface.'],['We are going ___ the station.',['at','to','on'],1,'To introduces a destination after go.']]},
{title:'Wh-questions & subject questions',group:'Questions',level:'A2–B1',rule:'Use who for people, whose for possession, where for place and why for reasons. What is open-ended; which often selects from a limited set. If who/what is the subject, do not normally use do/does/did.',it:'Who indica persone, whose possesso, where luogo e why motivi. What lascia una scelta aperta; which spesso sceglie tra alternative limitate. Se who/what è soggetto, normalmente non usare do/does/did.',rows:[['Object question','Who did you call? → I called Anna.'],['Subject question','Who called you? → Anna called me.'],['Choice / possession','Which room do you prefer? / Whose bag is this?'],['Quantity / frequency','How much is it? / How many tickets? / How often do you walk?']],error:'Who did call you? → Who called you? (neutral subject question).',q:[['Ask about the caller: Anna called me.',['Who called you?','Who did you call?','Who you called?'],0,'Who is the subject, so no did is needed.'],['___ bag is this? It is Anna’s.',['Who','Whose','Where'],1,'Whose asks about possession.']]},
{title:'There is / are & it is',group:'Useful structures',level:'A2',rule:'There is/are introduces the existence or presence of something. It is identifies or describes something, or expresses weather and time. There was/were are the past forms. Use is with an uncountable noun.',it:'There is/are introduce l’esistenza o presenza di qualcosa. It is identifica o descrive qualcosa, oppure esprime tempo atmosferico e orario. Al passato usa there was/were. Con un nome non numerabile usa is.',rows:[['Singular / plural','There is a park. / There are two cafés.'],['Question / negative','Is there a lift? / There aren’t any shops.'],['Uncountable','There is some water.'],['Description','There is a hotel nearby. It is very quiet.']],error:'It is a supermarket near here → There is a supermarket near here.',q:[['There ___ some bread on the table.',['are','is','be'],1,'Bread is uncountable, so use is.'],['___ is raining.',['There','It','They'],1,'Use it for weather.']]},
{title:'Have, have got & have to',group:'Useful structures',level:'A2',rule:'Have and have got can express present possession. Have got makes questions with have/has, not do. For past possession, use had. Have to + base verb expresses necessity and uses do/does/did in simple-tense questions.',it:'Have e have got possono esprimere possesso al presente. Have got forma domande con have/has, senza do. Per il possesso passato usa had. Have to + verbo base esprime necessità e usa do/does/did nelle domande ai tempi semplici.',rows:[['Present possession','I have a car. / I’ve got a car.'],['Questions','Do you have a car? / Have you got a car?'],['Past possession','We had a small flat. → Did you have a garden?'],['Necessity / activity','I have to leave. / We have lunch at one.']],error:'Do you have got…? → Do you have…? / Have you got…?',link:'verbs',q:[['___ she got a passport?',['Does','Has','Is'],1,'Have got makes questions with have/has.'],['Yesterday we ___ to leave early.',['have got','had','has'],1,'The past of have to is had to.']]},
{title:'Imperatives & let’s',group:'Useful structures',level:'A2',rule:'Use the base verb for instructions, invitations and directions. The subject you is normally omitted. Use don’t + base verb for a negative instruction. Let’s + base verb makes a suggestion including the speaker.',it:'Usa la forma base per istruzioni, inviti e indicazioni. Il soggetto you di solito si omette. Per una proibizione usa don’t + verbo base. Let’s + verbo base propone qualcosa includendo chi parla.',rows:[['Instructions','Open the window, please. / Turn left.'],['Negative','Don’t touch the oven.'],['Suggestion','Let’s go for a walk.'],['Negative suggestion','Let’s not take the car today.']],error:'Let’s to go → Let’s go.',q:[['___ late, please.',['Don’t be','Not be','Don’t to be'],0,'Negative imperative: don’t + base verb.'],['Let’s ___ a break.',['taking','to take','take'],2,'Let’s takes the base form.']]},
{title:'Linkers & defining relative clauses',group:'Connecting ideas',level:'B1',rule:'Because introduces a reason; so introduces a result. Although introduces a contrast. Who refers to people, which to things, and that can refer to either in a defining relative clause. A defining clause identifies which person or thing we mean.',it:'Because introduce il motivo; so la conseguenza. Although introduce un contrasto. Who indica persone, which cose, that può indicare entrambe nelle relative determinative. Una relativa determinativa identifica la persona o cosa di cui parliamo.',rows:[['Reason / result','We stayed home because it rained. / It rained, so we stayed home.'],['Contrast','Although it was cold, we went out.'],['Person / thing','A guide who speaks Italian / a hotel that has a pool'],['No repeated pronoun','The café that we visited was lovely.']],error:'Although it rained, but we went out → Although it rained, we went out.',q:[['The woman ___ helped us was kind.',['which','who','where'],1,'Who refers to a person.'],['It was raining, ___ we took an umbrella.',['because','so','although'],1,'So introduces the result.']]},
{title:'Zero & first conditional',group:'B1 step forward',level:'B1',rule:'Zero conditional describes general truths: if + present, present. First conditional describes a real future possibility: if + present, will + base verb. When the if-clause comes first, usually add a comma.',it:'Il periodo ipotetico zero esprime fatti generali: if + presente, presente. Il primo esprime possibilità future reali: if + presente, will + verbo base. Quando la proposizione con if è all’inizio, di solito segue una virgola.',rows:[['General truth','If you heat ice, it melts.'],['Future possibility','If it rains tomorrow, we’ll stay inside.'],['Reverse order','We’ll stay inside if it rains.'],['Unless = if not','We’ll walk unless it rains.']],error:'If it will rain, we’ll stay home → If it rains, we’ll stay home.',q:[['If she ___ early, we’ll have time for lunch.',['will arrive','arrives','arrived'],1,'First conditional uses present simple after if.'],['If you freeze water, it ___ ice.',['becomes','will became','become'],0,'A general truth uses present simple in both clauses.']]},
{title:'Second conditional & used to',group:'B1 step forward',level:'B1',rule:'The second conditional imagines an unlikely or hypothetical present/future: if + past simple, would + base verb. Used to + base verb describes past habits or states that are no longer true. These past forms do different jobs.',it:'Il secondo periodo ipotetico immagina situazioni ipotetiche o poco probabili nel presente/futuro: if + past simple, would + verbo base. Used to + verbo base descrive abitudini o stati passati non più veri. Le forme passate hanno qui funzioni diverse.',rows:[['Imagined situation','If I had more time, I would travel more.'],['Advice','If I were you, I would book early.'],['Past habit / state','I used to walk to school. / We used to live in Rome.'],['Question / negative','Did you use to cycle? / I didn’t use to drive.']],error:'Did you used to…? → Did you use to…?',link:'verbs',q:[['If I had a garden, I ___ grow vegetables.',['will','would','am'],1,'Would + base verb expresses the hypothetical result.'],['I didn’t ___ to drink coffee.',['used','use','using'],1,'After did/didn’t, use the base form use.']]},
{title:'Reported speech: a first look',group:'B1 step forward',level:'B1',rule:'Reported speech tells someone what another person said. After a past reporting verb, a tense often moves back: am → was, will → would. Pronouns and time words change when the context requires it. Say can stand without a person; tell normally needs one.',it:'Il discorso indiretto riferisce ciò che qualcuno ha detto. Dopo un verbo introduttivo passato, il tempo spesso arretra: am → was, will → would. Pronomi ed espressioni temporali cambiano quando il contesto lo richiede. Say può stare senza persona; tell normalmente richiede il destinatario.',rows:[['Statement','Anna: “I am tired.” → Anna said she was tired.'],['Future','Ben: “I will call.” → Ben said he would call.'],['Tell + person','She told me she was busy.'],['Reporting a request','“Please wait.” → He asked us to wait.']],error:'She said me… → She told me… / She said to me…',q:[['Anna said, “I am tired.” → Anna said she ___ tired.',['was','were','has'],0,'Am often moves back to was after said.'],['She ___ me she was ready.',['said','told','tell'],1,'Told takes a person object: told me.']]}
];

</script><script>
// grammar.js
let grammarGroup='All',grammarLevel='All';
const grammarSources=`<details class="source-note"><summary>Sources & further reading</summary><p>Original explanations, examples and exercises for this book. Further reading: <a href="https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2" target="_blank" rel="noopener">British Council A1–A2 grammar</a> · <a href="https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/conditionals-zero-first-second" target="_blank" rel="noopener">Conditionals</a> · <a href="https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/reported-speech-statements" target="_blank" rel="noopener">Reported speech</a>. The <a href="https://www.studocu.com/it/document/universita-degli-studi-di-cagliari/lingua-inglese-4/inglese-a2-grammatica-e-vocabolario-essenziali/141711119" target="_blank" rel="noopener">Studocu reference supplied by Fabrizio</a> inspired the side-by-side table format. Independent study material; no affiliation with these publishers.</p></details>`;
function grammarIndex(){app.innerHTML=`<span class="eyebrow">THE GRAMMAR COMPANION</span><h1>See the pattern.<br>Find your words.</h1><p class="muted">20 reference pages · A2 foundations to B1 first steps · Rules you can return to.</p><div class="grammar-overview"><div><span class="eyebrow">A SIMPLE WAY TO STUDY</span><h3>Read. Compare. Try.</h3><p>Find a rule, compare the examples, then check your understanding with two short questions.</p></div><div><strong>Need a verb tense?</strong><a href="#verbs">Explore the verb handbook ↗</a><strong>Describing or comparing?</strong><a href="#adjectives">Open adjectives & adverbs ↗</a></div></div><div class="vocab-toolbar"><input id="grammarsearch" class="search" aria-label="Search grammar" placeholder="Search: articles, pronomi, have got, if…"><select id="grammarlevel" aria-label="Filter grammar level">${['All','A2','B1'].map(x=>`<option value="${x}" ${grammarLevel===x?'selected':''}>${x==='All'?'All levels':x}</option>`).join('')}</select></div><div class="category-strip">${['All',...new Set(grammarTopics.map(t=>t.group))].map(x=>`<button class="chip ${grammarGroup===x?'selected':''}" data-ggroup="${x}">${x}</button>`).join('')}</div><p id="grammarcount" class="small muted" role="status"></p><div id="grammarcards" class="grammar-cards"></div><div class="note"><strong>Your reference desk.</strong> These pages complement the twelve-chapter learning path. A2/B1 labels guide your study; they are not a complete exam syllabus.</div>${grammarSources}`;const update=()=>{const q=document.querySelector('#grammarsearch').value.toLowerCase();const topics=grammarTopics.map((t,i)=>({t,i})).filter(({t})=>(grammarGroup==='All'||t.group===grammarGroup)&&(grammarLevel==='All'||t.level.includes(grammarLevel))&&JSON.stringify(t).toLowerCase().includes(q));document.querySelector('#grammarcount').textContent=topics.length+(topics.length===1?' reference page':' reference pages');document.querySelector('#grammarcards').innerHTML=topics.map(({t,i})=>`<a class="grammar-card" href="#grammar/${i}"><div class="grammar-card-top"><span class="small muted">${String(i+1).padStart(2,'0')} / ${t.group}</span>${badge(t.level)}</div><h3>${t.title}</h3><p>${t.rows[0][1]}</p><span class="small grammar-card-bottom">Rule · examples · 2 questions <span>↗</span></span></a>`).join('')||'<p>No topics found. Try another word, group or level.</p>'};document.querySelector('#grammarsearch').oninput=update;document.querySelector('#grammarlevel').onchange=e=>{grammarLevel=e.target.value;update()};document.querySelectorAll('[data-ggroup]').forEach(b=>b.onclick=()=>{grammarGroup=b.dataset.ggroup;document.querySelectorAll('[data-ggroup]').forEach(x=>x.classList.toggle('selected',x===b));update()});update()}
function grammarPage(i){const t=grammarTopics[i];if(!t){grammarIndex();return}app.innerHTML=`<a href="#grammar" class="small muted">← Grammar index</a><div class="grammar-page-header"><span class="eyebrow">REFERENCE ${String(i+1).padStart(2,'0')} · ${t.group}</span><h1>${t.title}</h1>${badge(t.level)}</div><div class="grammar-layout"><article class="page"><section class="panel"><h3>The rule</h3><p>${t.rule}</p>${tr(t.it)}</section><h2>See the structure.</h2><div class="panel table-wrap"><table><thead><tr><th>USE / FORM</th><th>EXAMPLE</th></tr></thead><tbody>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${escape(r[1])}</td></tr>`).join('')}</tbody></table></div><div class="mistake"><span class="eyebrow">COMMON MISTAKE</span><p>${escape(t.error)}</p></div>${t.link?`<div class="note">Go further: <a href="#${t.link}"><u>Open the verb handbook ↗</u></a></div>`:''}<section class="grammar-practice"><span class="eyebrow">YOUR TURN</span><h2>Try the pattern.</h2><form id="grammarquiz">${t.q.map((q,n)=>`<div class="question"><strong>${n+1}. ${escape(q[0])}</strong>${q[1].map((x,k)=>`<label class="option"><input type="radio" name="g${n}" value="${k}" required>${escape(x)}</label>`).join('')}<div id="gf${n}" aria-live="polite"></div></div>`).join('')}<button class="btn">Check answers →</button> <button class="btn secondary" type="reset">Try again</button><p id="grammarscore" role="status"></p></form></section><div class="lesson-bottom">${i>0?`<a class="btn secondary" href="#grammar/${i-1}">← Previous topic</a>`:''}${i<grammarTopics.length-1?`<a class="btn" href="#grammar/${i+1}">Next topic →</a>`:'<a class="btn" href="#grammar">Back to grammar →</a>'}</div>${grammarSources}</article><div class="grammar-side"><span class="eyebrow">IN THIS GROUP</span>${grammarTopics.map((r,n)=>({r,n})).filter(({r})=>r.group===t.group).map(({r,n})=>`<a href="#grammar/${n}" ${n===i?'aria-current="page" class="current"':''}>${r.title} ↗</a>`).join('')}<hr><a href="#verbs">Verbs & tenses ↗</a><a href="#adjectives">Adjectives & adverbs ↗</a><a href="#glossary">Vocabulary ↗</a></div></div>`;const f=document.querySelector('#grammarquiz');f.onsubmit=e=>{e.preventDefault();let score=0;t.q.forEach((q,n)=>{const ok=Number(f.elements['g'+n].value)===q[2];score+=ok;document.querySelector('#gf'+n).innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correct.':'Correct answer: '+escape(q[1][q[2]])+'.'} ${q[3]}</div>`});document.querySelector('#grammarscore').textContent=score+' / 2 correct. '+(score===2?'Well done!':'Check the rule and try again.')};f.onreset=()=>{t.q.forEach((_,n)=>document.querySelector('#gf'+n).innerHTML='');document.querySelector('#grammarscore').textContent=''}}
const referenceRoute=route;
route=function(){referenceRoute();const parts=(location.hash.slice(1)||'home').split('/');if(parts[0]==='grammar'){if(parts.length>1&&/^\d+$/.test(parts[1]))grammarPage(Number(parts[1]));else grammarIndex()}const entry=document.createElement('a');entry.href='#grammar';entry.className=parts[0]==='grammar'?'active':'';entry.innerHTML='<span>§</span>Grammar';document.querySelector('#nav').insertBefore(entry,document.querySelector('#nav a[href="#verbs"]'));if(parts[0]==='home'){document.querySelector('.handbook-links').insertAdjacentHTML('afterbegin','<a href="#grammar"><span>§</span><div><strong>The grammar companion</strong><small>20 rules to return to</small></div>↗</a>')}};
window.onhashchange=()=>{tab='Grammar';route()};route();

['Time expressions','⌚',`today|oggi|adverb|I am working from home today.
yesterday|ieri|adverb|We visited our friends yesterday.

ck'],[7,30,'7:30','half past seven / seven thirty'],[3,15,'3:15','a quarter past three / three fifteen'],[8,45,'8:45','a quarter to nine / eight forty-five']].map(([hour,minute,n,s])=>`<div class="clock-card"><div class="analog-clock" aria-hidden="true"><i class="hour-hand" style="transform:rotate(${hour*30+minute/2}deg)"></i><i class="minute-hand" style="transform:rotate(${minute*6}deg)"></i></div><strong>${n}</strong><p>${s}</p></div>`).join('')}</div><div class="note">a.m. = before noon · p.m. = after noon. Use <strong>noon / midday</strong> and <strong>midnight</strong> to avoid confusion around 12:00.${tr('A.m. indica prima di mezzogiorno, p.m. dopo mezzogiorno. Per le 12:00 è più chiaro dire noon/midday (mezzogiorno) e midnight (mezzanotte).')}</div><div class="section-head"><h2>Time expressions.</h2></div><p class="muted">The context chooses the tense. A time expression is a clue, not an automatic rule.</p><div class="time-expression-grid">${timePairs.map(([en,it,example])=>`<article class="time-expression"><strong>${en}</strong>${tr(it)}<p>${example}</p></article>`).join('')}</div><div class="mistake"><strong>Every day ≠ everyday.</strong> I study every day. / These are everyday expressions.${tr('Every day significa ogni giorno ed è un’espressione temporale. Everyday è un aggettivo: quotidiano, comune.')}</div>`;

const modalCards=[
['Can & could: ability','A2','Can describes present ability. Could often describes general past ability. For one successful action in a specific past situation, was/were able to is often clearer.','Can indica capacità presenti. Could descrive spesso capacità generali passate. Per un singolo successo in una situazione passata, was/were able to è spesso più chiaro.',['I can swim. / Can you drive?','When I was younger, I could run very fast.','We were able to find a room for the night.']],
['Permission & polite requests','A2','Use Can I…? or Could I…? to ask permission. Use Can you…? or Could you…? to ask someone to do something; could usually sounds more polite. Give permission with can, not normally could.','Can I…? e Could I…? chiedono permesso. Can you…? e Could you…? chiedono a qualcuno di fare qualcosa; could è generalmente più cortese. Per concedere un permesso si usa can, normalmente non could.',['Could I open the window? → Yes, you can.','Can I sit here? / Could you repeat that, please?','Could you help me with this suitcase?']],
['Must & have to: necessity','A2–B1','Both express strong necessity. Must often presents an instruction or the speaker’s strong view; have to often describes a requirement from circumstances or rules. This is a tendency, not a strict division. Use had to for past obligation.','Entrambi esprimono necessità forte. Must spesso dà un’istruzione o esprime il punto di vista di chi parla; have to spesso descrive una necessità dovuta a circostanze o regole. È una tendenza, non una distinzione assoluta. Per obblighi passati usa had to.',['You must keep your ticket.','We have to check out by ten. → Do we have to leave now?','Yesterday I had to work late.']],
['Mustn’t ≠ don’t have to','A2–B1','Mustn’t means prohibited. Don’t have to means not necessary: you may do it, but there is no obligation. Needn’t can also mean not necessary.','Mustn’t indica un divieto. Don’t have to significa non necessario: puoi farlo, ma non sei obbligato. Anche needn’t può indicare mancanza di necessità.',['You mustn’t take photos here. = Photos are prohibited.','You don’t have to book. = Booking is optional.','We needn’t hurry. = There is no need to hurry.']],
['Should: advice','A2','Should + base verb gives advice or a recommendation. Use shouldn’t for advice against an action. It does not normally express the same strength of obligation as must.','Should + forma base dà un consiglio o una raccomandazione. Shouldn’t sconsiglia un’azione. Normalmente non esprime un obbligo forte come must.',['You should book your tickets early.','We shouldn’t leave it until the last minute.','Should I bring a jacket?']],
['Build the form','A2','Core modal verbs use the same form for every subject and take a base verb without to. Move the modal before the subject in questions; add not for negatives. Have to is different and uses do/does/did in simple-tense questions.','I modali principali non cambiano con la persona e reggono la forma base senza to. Nelle domande il modale precede il soggetto; per negare aggiungi not. Have to è diverso e usa do/does/did nelle domande ai tempi semplici.',['She can come. / Can she come? / She can’t come.','He should wait. / Should he wait? / He shouldn’t wait.','Does she have to work? / She doesn’t have to work.']]
